method: searched
source: https://www.lyft.com/developers (302 to account.lyft.com/auth/email), https://help.lyft.com/business/hc/en-us/articles/360001599667-Concierge-API-overview,
  https://www.lyft.com/pricing (404), GBFS system_pricing_plans feeds
description: Lyft publishes no developer plans, tiers or API price list. There is no pricing page for the API (https://www.lyft.com/pricing
  returns 404) and the developer portal redirects to a login, so no tier, quota or overage can be read by an unauthenticated
  buyer. The only pricing statement on an anonymously readable Lyft page is the Concierge API help-centre article,
  which says an organisation pays for the rides it uses — consumption of the underlying service, not a subscription
  to the API. This file replaces a 2026-05-04 scaffold that asserted Free/Professional/Enterprise tiers with invented
  per-minute and monthly quotas; Lyft has never published any of those numbers.
plan_count: 0
plans: []
commercial_model:
  shape: contracted, consumption-priced
  statement: '"only pay for the rides you use"'
  evidence: https://help.lyft.com/business/hc/en-us/articles/360001599667-Concierge-API-overview (200)
  access: API access is granted through a Lyft Business relationship; the help centre instructs organisations to
    contact their Lyft Business representative and to attach an API client to a program in the Lyft Business Portal.
  access_evidence: https://help.lyft.com/business/hc/en-us/articles/8587470351891-Managing-your-API-client-and-program-connections
    (200)
  free_tier: false
  self_serve: false
  published_price_list: false
service_pricing:
  note: NOT API pricing. Lyft does publish machine-readable consumer ride pricing for its micromobility fleet, through
    the GBFS system_pricing_plans feed of each system. It is recorded here because it is the only first-party price
    data Lyft serves anonymously, and it prices the service an integrator dispatches — but it is not a plan for
    access to an API and is NOT counted in plan_count.
