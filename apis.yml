description: 'Lyft is a transportation network company operating ride-hailing, bikeshare, scooter-share
  and related mobility services across the United States and Canada. Its API surface has two halves that
  behave very differently. The ride-hailing developer program — the Rides and Concierge APIs on api.lyft.com,
  used for patient transport, employee transit and customer-service ride booking — is gated: www.lyft.com/developers
  redirects to a sign-in, access is granted through a Lyft Business relationship, and the old documentation
  host developer.lyft.com no longer resolves. The micromobility side is wide open: Lyft serves live GBFS
  feeds for eight bikeshare and scooter systems (Citi Bike, Divvy, Bay Wheels, Bluebikes, Capital Bikeshare,
  Biketown, and its own DC and Denver fleets) anonymously from gbfs.lyft.com, alongside a public RFC 8414
  OAuth metadata document that publishes the platform''s full 47-scope vocabulary.'
