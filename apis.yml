- aid: lyft:lyft-gbfs-feeds
  name: Lyft Micromobility GBFS Feeds
  description: Live General Bikeshare Feed Specification (GBFS) feeds for the eight bikeshare and scooter
    systems Lyft operates — Citi Bike, Divvy, Bay Wheels, Bluebikes, Capital Bikeshare, Biketown, Lyft
    Scooters DC and Lyft Denver. Station inventory and status, free-floating vehicles, vehicle types,
    service alerts, system hours and regions, and machine-readable consumer ride pricing, all served anonymously
    from Lyft's own host with no key and no account. 96 feed endpoints across 8 systems, GBFS 1.1 and
    2.3.
