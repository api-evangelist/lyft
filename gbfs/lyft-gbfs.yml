description: 'Lyft serves live GBFS feeds for eight micromobility systems from its own host, gbfs.lyft.com. GBFS
  is the open domain standard for shared-mobility data, and these feeds are the only public, anonymous, machine-readable,
  first-party API contract Lyft currently serves: the ride-hailing developer portal is login-gated and api.lyft.com
  publishes no specification. Every system''s own system_information document declares a system_id of the form lyft_<code>
  and, in six of eight cases, an operator of "Lyft" or "Motivate International, Inc." (Lyft''s micromobility subsidiary)
  — so ownership is asserted by the documents themselves, not inferred from the fetch host. Brand-domain discovery
  URLs (citibikenyc.com, divvybikes.com, baywheels.com, bluebikes.com, capitalbikeshare.com, biketownpdx.com) list
  feed URLs that all resolve to gbfs.lyft.com.'
ownership_evidence:
- gbfs/lyft-nyc-system-information.json declares system_id "lyft_nyc", operator "Lyft".
- gbfs/lyft-dca-system-information.json declares system_id "lyft_dca", name "Lyft Scooters", operator "Motivate
  International, Inc.", url https://www.lyft.com/scooters/washington-dc.
- Every brand-domain gbfs.json lists feed URLs on the host gbfs.lyft.com.
system_count: 8
endpoint_count: 96
auth: none — every feed is served anonymously over HTTPS
