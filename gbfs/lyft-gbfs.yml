findings:
- Two of the eight systems (lyft_bay, lyft_bos) still serve GBFS 1.1, a version superseded by 2.3 on the other six
  — a consumer reading the fleet has to handle two versions of the standard from one provider.
- 'The lyft_den feed is stale: it advertises ttl 60 seconds but its last_updated is 2024-12-16T17:57:06Z, roughly
  21 months before this probe, while every other system updated within a minute of it. A consumer honouring ttl
  would poll it every minute forever and never see a change.'
- system_pricing_plans is served per system and carries real machine-readable consumer ride pricing (see plans/lyft-plans-pricing.yml
  service_pricing).
- cogobikeshare.com (CoGo, Columbus OH) did not resolve at probe time, so that system is not recorded here.
