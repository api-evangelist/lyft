naftiko: 1.0.0-alpha2
info:
  label: Lyft Ride-Sharing API — Cost Estimates
  description: 'Lyft Ride-Sharing API — Cost Estimates. 1 operations. Lead operation: List cost estimates. Self-contained
    Naftiko capability covering one Lyft business surface.'
  tags:
  - Lyft
  - Cost Estimates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LYFT_API_KEY: LYFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: ride-sharing-cost-estimates
    baseUri: https://api.lyft.com/v1
    description: Lyft Ride-Sharing API — Cost Estimates business capability. Self-contained, no shared references.
    resources:
    - name: cost
      path: /cost
      operations:
      - name: listcostestimates
        method: GET
        description: List cost estimates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start_lat
          in: query
          type: number
          description: Latitude of the starting location.
          required: true
        - name: start_lng
          in: query
          type: number
          description: Longitude of the starting location.
          required: true
        - name: end_lat
          in: query
          type: number
          description: Latitude of the destination location.
          required: true
        - name: end_lng
          in: query
          type: number
          description: Longitude of the destination location.
          required: true
        - name: ride_type
          in: query
          type: string
          description: A specific ride type to filter cost estimates by.
    authentication:
      type: bearer
      token: '{{env.LYFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: ride-sharing-cost-estimates-rest
    port: 8080
    description: REST adapter for Lyft Ride-Sharing API — Cost Estimates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cost
      name: cost
      description: REST surface for cost.
      operations:
      - method: GET
        name: listcostestimates
        description: List cost estimates
        call: ride-sharing-cost-estimates.listcostestimates
        with:
          start_lat: rest.start_lat
          start_lng: rest.start_lng
          end_lat: rest.end_lat
          end_lng: rest.end_lng
          ride_type: rest.ride_type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ride-sharing-cost-estimates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lyft Ride-Sharing API — Cost Estimates. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-cost-estimates
      description: List cost estimates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ride-sharing-cost-estimates.listcostestimates
      with:
        start_lat: tools.start_lat
        start_lng: tools.start_lng
        end_lat: tools.end_lat
        end_lng: tools.end_lng
        ride_type: tools.ride_type
      outputParameters:
      - type: object
        mapping: $.
