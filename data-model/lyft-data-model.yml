id_conventions:
  style: opaque string ride ids in the {id} path parameter
  prefixes_documented: false
  note: No id-prefix scheme is documented; the object reference is not publicly readable.
findings:
- ConciergeRide/ConciergeDriver/ConciergeVehicle/ConciergePrice duplicate the ride-surface entities instead of sharing
  them, so a consumer integrating both surfaces carries two models of the same real-world objects.
- Location is the one schema genuinely shared between the two surfaces.
