description: 'Lyft publishes no rate limits for its API. This file replaces a 2026-05-04 scaffold that asserted
  10/100/1000 requests per minute across Free, Professional and Enterprise tiers with monthly quotas; none of those
  numbers was ever published by Lyft, and Lyft publishes no such tiers (see plans/lyft-plans-pricing.yml). An honest
  zero is the finding: an integrator cannot learn the throttling contract before signing one.'
