notes:
- openid + profile + offline are present, but api.lyft.com serves no /.well-known/openid-configuration
  (404), so the OIDC discovery document is absent even though OIDC scopes are advertised.
- lyft_rider_mcp.read is an MCP-specific scope in the published vocabulary — first-party evidence that
  an MCP surface exists behind authentication. No anonymously reachable MCP endpoint was found (see mcp/lyft-mcp.yml).
- rides.subscribe_all, rides.subscribe_ride_request, rides.subscribe_ride_receipt, memberships.updates_subscribe
  and tapi.atms.webhook are subscription/webhook scopes (see asyncapi/lyft-webhooks.yml).
- The 18 operations in openapi/ are covered by a small part of this vocabulary; most scopes belong to
  Lyft Business, enterprise, driver and privileged partner surfaces that publish no public contract.
